{% extends 'core/base.html' %}

{% block title %}Projects{% endblock %}

{% block content %}
    <h1>My Projects</h1>

    <ul>
    {% for project in projects %}
        <li>
            {{ project.name }}
            {% if project.status == 'Done' %}
                ✅
            {% else %}
                ⏳
            {% endif %}
        </li>
    {% empty %}
        <li>No projects yet.</li>
    {% endfor %}
    </ul>
{% endblock %}
