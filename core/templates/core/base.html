{% load static %}
<!DOCTYPE html>
<html>
    <head>
        <title>{% block title %}My Site{% endblock %}</title>
        <link rel="stylesheet" type="text/css" href="{% static 'core/style.css' %}">
    </head>
    <body>
        <header>
            <nav>
                {# Day 7 — using {% url %} (recommended, future-proof) #}
                <a href="{% url 'core:home' %}">Home</a> |
                <a href="{% url 'core:about' %}">About</a> |
                <a href="{% url 'core:projects' %}">Projects</a> |
                <a href="{% url 'core:post_detail' post_id=1 %}">Post 1</a>

                {# Day 6 — hardcoded paths (works, but breaks if URLs change) #}
                {# <a href="/">Home</a> | #}
                {# <a href="/about/">About</a> #}
            </nav>
        </header>

        <main>
            {% block content %}
            {% endblock %}
        </main>
    </body>
</html>
